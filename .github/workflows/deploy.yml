# ─────────────────────────────────────────────────────────────────────────────
# Andela LMS — CI/CD Pipeline
#
# Pull requests → quality checks only.
# Push to main  → checks, then a full `firebase deploy` (Next.js SSR hosting +
#                 Cloud Functions + Firestore/Storage rules) using the CLI's
#                 web-frameworks support — the same mechanism as a local deploy.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT                  — full JSON of a service-account key
#                                               (Firebase Console → Project settings
#                                               → Service accounts → Generate key)
#   NEXT_PUBLIC_FIREBASE_API_KEY              ┐
#   NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN          │ public web config — baked into the
#   NEXT_PUBLIC_FIREBASE_PROJECT_ID           │ client bundle at build time
#   NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET       │ (same values as .env.local)
#   NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID  │
#   NEXT_PUBLIC_FIREBASE_APP_ID               ┘
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy to Firebase

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "22"
  PROJECT_ID: andela-lms-dae5f
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Quality gate ────────────────────────────────────────────────────────────
  check:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      # Rules tests need the Firestore emulator. `emulators:exec` starts it,
      # runs the suite, and tears it down. The demo- project prefix keeps the
      # emulator fully offline (no credentials touched).
      - name: Firestore security-rules tests (emulator)
        run: |
          npx firebase-tools@15 experiments:enable webframeworks
          npx firebase-tools@15 emulators:exec --only firestore --project demo-andela-lms "npm run test:rules"

  # ── Build + deploy everything (main only) ───────────────────────────────────
  deploy:
    name: Deploy (hosting SSR + functions + rules)
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The service-account JSON is written to a temp file and exposed via
      # GOOGLE_APPLICATION_CREDENTIALS — the standard auth path for firebase-tools.
      - name: Write service-account key
        run: |
          cat > "$RUNNER_TEMP/sa.json" <<'EOF'
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EOF

      # AI features: the Claude API key is injected from a GitHub secret into
      # functions/.env (gitignored) — firebase-tools uploads .env values to the
      # functions runtime at deploy. If the secret is unset, AI callables
      # return failed-precondition and everything else works normally.
      - name: Write functions runtime env
        run: |
          if [ -n "${ANTHROPIC_API_KEY}" ]; then
            {
              echo "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}"
              if [ -n "${AI_MODEL}" ]; then echo "AI_MODEL=${AI_MODEL}"; fi
            } >> functions/.env
            echo "functions/.env written (AI features enabled)"
          else
            echo "ANTHROPIC_API_KEY secret not set — deploying with AI features disabled"
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}

      - name: Enable Next.js web-frameworks support
        run: npx firebase-tools@15 experiments:enable webframeworks

      # One deploy covers everything: the frameworks adapter runs `next build`
      # here (with the NEXT_PUBLIC_* env baked in), firebase.json's predeploy
      # hook installs + compiles functions, and rules deploy alongside.
      # --debug so failures surface their real cause instead of
      # "An unexpected error has occurred."
      - name: Deploy to Firebase
        run: npx firebase-tools@15 deploy --project "$PROJECT_ID" --non-interactive --force --debug
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
